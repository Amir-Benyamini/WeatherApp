<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css" integrity="sha384-HzLeBuhoNPvSl5KYnjx0BT+WB0QEEqLprO+NBkkk5gbc67FTaL7XIGa2w1L0Xbgc" crossorigin="anonymous">

	<title>WeatherApp</title>
</head>
<body>

	<header>
		<h1>WeatherApp</h1>
		<p>Search any city and save your favorites</p>
	</header>

	<div id="search">
		<input type="text" placeholder="Enter city name..." id="cityInp" autocomplete="off">
		<button id="inpBtn" type="button">Search</button>
	</div>

	<div id="result-container"></div>

	<script id="city-template" type="text/x-handlebars-template">
		<div class="weather-card">
			<div class="card-city">{{name}}</div>
			<div class="card-icon">{{{icon}}}</div>
			<div class="card-temp">{{temperature}}<span> °C</span></div>
			<div class="card-humidity"><i class="fas fa-tint"></i> {{humidity}}% humidity</div>
			<div class="card-divider"></div>
			<div class="card-desc">{{description}}</div>
			<div class="card-actions">
				<button class="card-btn btn-add" title="Save city"><i class="fas fa-plus" id="plus"></i></button>
				<button class="card-btn btn-remove" title="Remove city"><i class="fas fa-minus" id="minus"></i></button>
			</div>
		</div>
	</script>

	<script src="/jquery/dist/jquery.js"></script>
	<script src="/handlebars/dist/handlebars.js"></script>
	<script src="model.js"></script>
	<script src="view.js"></script>
	<script src="main.js"></script>
</body>
</html>
